name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-plane:
    name: Control plane (Java 25 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dtunnel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: dtunnel/pom.xml
      # Testcontainers needs a reachable Docker daemon; GitHub runners provide one.
      # Docker Engine on the runner speaks API >= 1.44, matching the pom's
      # docker.api.version property (Engine 29 dropped older APIs).
      - name: Test
        run: ./mvnw -B test

  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dtunnel-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: dtunnel-agent/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o bin/duox-agent ./cmd/duox-agent

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
