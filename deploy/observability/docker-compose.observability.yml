# detail.md Milestone 4.4: observability as a SECOND compose stack.
# Joins the core stack's network so it can scrape control-plane:8080.
# Bring up the core stack first (deploy/compose), then:
#   docker compose -f docker-compose.observability.yml up -d
services:
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [obs, core]

  loki:
    image: grafana/loki:3.0.0
    ports: ["3100:3100"]
    networks: [obs]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: ["./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"]
    ports: ["3001:3000"]
    depends_on: [prometheus, loki]
    networks: [obs, core]

networks:
  obs:
  core:
    external: true
    name: compose_default
