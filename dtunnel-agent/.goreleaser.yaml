# detail.md §3.4: cross-compiled release builds for both agent binaries —
# duox-agent (user side) and duox-node-agent (gateway side, §1/§16).
version: 2

project_name: duox-agents

builds:
  - id: duox-agent
    main: ./cmd/duox-agent
    binary: duox-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

  - id: duox-node-agent
    main: ./cmd/duox-node-agent
    binary: duox-node-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc

release:
  draft: true
