spring.application.name=dtunnel
server.port=8080

# Java 21+ virtual threads — blocking MVC model, cheap concurrency (detail.md §3.1)
spring.threads.virtual.enabled=true

# PostgreSQL — source of truth (detail.md §3.2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tunnelplatform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tunnelplatform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

# Flyway owns schema evolution; Hibernate only validates (detail.md §7)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Redis — sessions, agent tokens, rate limits (detail.md §3.3)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.session.timeout=30m
spring.session.redis.namespace=dtunnel:session

# Session cookie hardening (detail.md §15)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Observability (detail.md §3.7)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# dtunnel-specific
dtunnel.bootstrap.superadmin.email=${DTUNNEL_SUPERADMIN_EMAIL:admin@duox.local}
dtunnel.bootstrap.superadmin.password=${DTUNNEL_SUPERADMIN_PASSWORD:admin-change-me}
# device session token lifetime issued after keypair-based auth (detail.md §6, §15)
dtunnel.agent.token-ttl=PT24H
# no heartbeat beyond this window -> agent OFFLINE (detail.md §10)
dtunnel.agent.stale-threshold=PT60S
# shared secret frps presents when calling the server-plugin endpoint (empty = disabled)
dtunnel.frp.plugin-token=${DTUNNEL_FRP_PLUGIN_TOKEN:}
