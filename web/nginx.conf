# SPA hosting + proxy /api and /agent to the control plane (detail.md §13).
# Upstreams resolve at request time via Docker's embedded DNS so startup
# doesn't fail if the control plane restarts.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — client-side routing owns every non-file path
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://control-plane:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /agent/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://control-plane:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
